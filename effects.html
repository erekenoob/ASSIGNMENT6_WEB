<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

<body>

    <nav class="navbar">
        <a href="index.html">Selectors</a>
        <a href="effects.html">Effects</a>
        <a href="dom.html">DOM</a>
        <a href="animations.html">Animations</a>

    <div class="container">
        <h1>jQuery Effects</h1>

        <div class="task-card">
            <h3>Visibility Methods</h3>
            <p id="vis-text">This paragraph can be hidden or shown using jquery buttons.</p>
            <button id="btn-hide">Hide</button>
            <button id="btn-show">Show</button>
            <button id="btn-toggle">Toggle</button>
        </div>

        <div class="task-card">
            <h3>Fade Methods</h3>
            <img id="fade-img" src="photo/Gemini_Generated_Image_gmwhzfgmwhzfgmwh.jpg" alt="Nature" width="350" style="display:block; margin-bottom:10px; border-radius:6px;">
            <button id="btn-fadeout">Fade Out</button>
            <button id="btn-fadein">Fade In</button>
            <button id="btn-fadetoggle">Fade Toggle</button>
        </div>

        <div class="task-card">
            <h3>Slide Methods</h3>
            <button id="btn-slideup">Slide Up</button>
            <button id="btn-slidedown">Slide Down</button>
            <button id="btn-slidetoggle">Slide Toggle</button>
            <div id="slide-panel">
                <p>Slide is here</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
